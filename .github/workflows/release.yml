name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create/update GitHub Release

jobs:
  release:
    name: Build signed release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "SIGNING_KEYSTORE_PATH=$PWD/release.keystore" >> "$GITHUB_ENV"

      - name: Tests + lint
        run: ./gradlew :app:lintFullRelease :app:testFullDebugUnitTest :app:testFdroidDebugUnitTest --console=plain

      - name: Assemble signed full AAB
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./gradlew :app:bundleFullRelease --console=plain

      - name: Assemble signed fdroid APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidRelease --console=plain

      - name: Verify F-Droid APK has zero proprietary classes
        run: |
          set -e
          APK="$(ls app/build/outputs/apk/fdroid/release/*.apk | head -1)"
          # The dex string check — APK is a zip containing classes*.dex; we use unzip + strings
          unzip -p "$APK" "classes*.dex" | strings | \
            grep -E '^Lio/sentry/|^Lcom/android/billingclient/|^Lcom/google/android/play/review/' && \
            { echo "::error::F-Droid APK contains proprietary classes"; exit 1; } || \
            echo "PASS: F-Droid APK clean of proprietary classes"

      - name: Detect Play SA presence
        run: |
          if [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON_PRESENT=true" >> "$GITHUB_ENV"
          fi

      - name: Upload Play AAB to Internal track
        if: env.PLAY_SERVICE_ACCOUNT_JSON_PRESENT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.rignanese.leo.slimfacebook
          releaseFiles: app/build/outputs/bundle/fullRelease/*.aab
          track: internal
          status: completed

      - name: Create GitHub Release with fdroid APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/fdroid/release/*.apk
            app/build/outputs/bundle/fullRelease/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
