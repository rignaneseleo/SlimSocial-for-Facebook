name: Release

# Pushing a version tag like 26.08.05+119 on master:
#   1. starts the Codemagic workflows that build the universal APKs with
#      exactly that version name/number,
#   2. waits for them to finish and downloads one APK from each,
#   3. creates a GitHub release with an auto-generated changelog and the APKs.
#
# There are two builds because there are two variants of the app: the Play
# build, and the free-software build that F-Droid ships, with Play Billing and
# the Play rating sheet compiled out (see docs/fdroid.md). They run in
# parallel, so waiting for both costs about as long as waiting for one.
#
# Requires the CODEMAGIC_API_TOKEN repository secret
# (Codemagic > Teams > Personal Account > Integrations > Codemagic API).
#
# The workflow can also be re-run for an existing tag via workflow_dispatch
# (e.g. if Codemagic or the release step failed).

# Deliberately NOT triggered by a tag push. Codemagic subscribes to tag pushes
# itself (see triggering: in codemagic.yaml) and builds, publishes to Google Play
# and needs no API token to do it. If this workflow also fired on a tag, two
# builds would race to upload the same version code and one would be rejected.
#
# Kept as a manual entry point: once CODEMAGIC_API_TOKEN exists, running this by
# hand against an existing tag rebuilds it and attaches the APK to a GitHub
# release, which the Codemagic-only path does not do.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)release, e.g. 26.08.05+119"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  # Same app id as the Codemagic build badge in README.md.
  CODEMAGIC_APP_ID: 645a7fe598007bd18863656d
  # The Play build. Required.
  CODEMAGIC_WORKFLOW_PLAY: release-android
  # The free-software build. Optional, and empty until the repository variable
  # is set, so this workflow keeps releasing a single APK until the second
  # Codemagic workflow exists. That workflow's id is the last path segment of
  # its settings URL in Codemagic.
  CODEMAGIC_WORKFLOW_FDROID: ${{ vars.CODEMAGIC_FDROID_WORKFLOW_ID }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match the release format <version>+<build>, e.g. 26.08.05+119"
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/master; then
            echo "::error::Tag '$TAG' does not point to a commit on master; releases are only built from master."
            exit 1
          fi

      - name: Generate changelog
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## Changelog"
            if [[ -n "$PREV_TAG" ]]; then
              git log --no-merges --pretty='- %s' "${PREV_TAG}..${TAG}"
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              git log --no-merges --pretty='- %s' "${TAG}"
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Start Codemagic builds
        id: codemagic
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
        run: |
          if [[ -z "$CODEMAGIC_API_TOKEN" ]]; then
            echo "::error::The CODEMAGIC_API_TOKEN repository secret is not configured."
            exit 1
          fi

          # Starts one Codemagic workflow and prints the build id it returned.
          # Progress goes to stderr so that stdout carries only the id.
          start_build() {
            local workflow="$1"
            local payload response build_id
            payload="$(jq -n \
              --arg appId "$CODEMAGIC_APP_ID" \
              --arg workflowId "$workflow" \
              --arg tag "$TAG" \
              '{appId: $appId, workflowId: $workflowId, tag: $tag,
                environment: {variables: {RELEASE_TAG: $tag}}}')"
            response="$(curl -fsS -X POST "https://api.codemagic.io/builds" \
              -H "Content-Type: application/json" \
              -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
              -d "$payload")"
            build_id="$(echo "$response" | jq -r '.buildId // empty')"
            if [[ -z "$build_id" ]]; then
              echo "::error::Codemagic did not return a buildId for '$workflow'. Response: $response"
              return 1
            fi
            echo "Started $workflow: https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$build_id" >&2
            echo "$build_id"
          }

          PLAY_BUILD_ID="$(start_build "$CODEMAGIC_WORKFLOW_PLAY")"
          echo "play_build_id=$PLAY_BUILD_ID" >> "$GITHUB_OUTPUT"

          if [[ -n "$CODEMAGIC_WORKFLOW_FDROID" ]]; then
            FDROID_BUILD_ID="$(start_build "$CODEMAGIC_WORKFLOW_FDROID")"
            echo "fdroid_build_id=$FDROID_BUILD_ID" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The CODEMAGIC_FDROID_WORKFLOW_ID repository variable is not set, so this release carries the Play APK only."
          fi

      - name: Wait for Codemagic builds
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          PLAY_BUILD_ID: ${{ steps.codemagic.outputs.play_build_id }}
          FDROID_BUILD_ID: ${{ steps.codemagic.outputs.fdroid_build_id }}
        run: |
          PENDING=("$PLAY_BUILD_ID")
          if [[ -n "$FDROID_BUILD_ID" ]]; then
            PENDING+=("$FDROID_BUILD_ID")
          fi

          #both builds are polled in one loop rather than one after the other:
          #they run in parallel on Codemagic, so waiting for them in sequence
          #would double the wait for no reason, and a failure in either should
          #stop this job straight away
          for i in $(seq 1 90); do
            STILL_RUNNING=()
            for build_id in "${PENDING[@]}"; do
              build_url="https://codemagic.io/app/$CODEMAGIC_APP_ID/build/$build_id"
              response="$(curl -sS -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
                "https://api.codemagic.io/builds/$build_id" || true)"
              status="$(echo "$response" | jq -r '.build.status // empty' 2>/dev/null || true)"
              echo "[$i/90] $build_id: ${status:-unreachable}"
              case "$status" in
                finished)
                  ;;
                failed|canceled|timeout|skipped)
                  echo "::error::Codemagic build ended with status '$status' — $build_url"
                  exit 1
                  ;;
                *)
                  STILL_RUNNING+=("$build_id")
                  ;;
              esac
            done
            PENDING=("${STILL_RUNNING[@]}")
            if [[ ${#PENDING[@]} -eq 0 ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for Codemagic — still running: ${PENDING[*]}"
          exit 1

      - name: Download the APKs
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          PLAY_BUILD_ID: ${{ steps.codemagic.outputs.play_build_id }}
          FDROID_BUILD_ID: ${{ steps.codemagic.outputs.fdroid_build_id }}
        run: |
          mkdir -p dist

          # Downloads a build's APK under the name the release should carry.
          # One APK per build: each Codemagic workflow emits a single universal
          # one, and both are named app-release.apk there, so the variant has to
          # be written into the file name here.
          download_apk() {
            local build_id="$1" name="$2" url
            url="$(curl -fsS -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
              "https://api.codemagic.io/builds/$build_id" \
              | jq -r '[.build.artefacts[] | select(.name | endswith(".apk"))][0].url // empty')"
            if [[ -z "$url" ]]; then
              echo "::error::No APK artefact on Codemagic build $build_id"
              return 1
            fi
            curl -fsSL -H "x-auth-token: $CODEMAGIC_API_TOKEN" -o "dist/$name" "$url"
            #fail here rather than hand GitHub a truncated or non-APK download
            unzip -l "dist/$name" > /dev/null
          }

          download_apk "$PLAY_BUILD_ID" "SlimSocial_for_Facebook_v${TAG}.apk"
          if [[ -n "$FDROID_BUILD_ID" ]]; then
            download_apk "$FDROID_BUILD_ID" "SlimSocial_for_Facebook_v${TAG}-fdroid.apk"
          fi
          ls -lh dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="SlimSocial for Facebook $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes and APKs."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
