name: slimsocial_for_facebook
description: >-
  A lightweight alternative to the official Facebook app: a hardened webview
  that strips the advertising and the tracking rather than reimplementing
  Facebook, with Messenger alongside it.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The version is the release. The Codemagic build reads it from here, not from
# the git tag, so this has to be bumped in its own commit *before* the matching
# tag is pushed - a tag pushed first builds the previous version. Every release
# tag from 117 onwards matches the value that was in this field at that commit.
version: 26.09.04+129

# Leonardo Rignanese <dev.rignaneseleo@gmail.com>
#
# Not an `author:` field: pubspec dropped it, and `flutter analyze` raises
# `deprecated_field` as a *warning* for it — the one warning in an otherwise
# warning-free tree. `flutter pub get` says nothing, so check with analyze.
homepage: https://github.com/rignaneseleo/SlimSocial-for-Facebook
repository: https://github.com/rignaneseleo/SlimSocial-for-Facebook
issue_tracker: https://github.com/rignaneseleo/SlimSocial-for-Facebook/issues
documentation: https://github.com/rignaneseleo/SlimSocial-for-Facebook#readme
funding:
  - https://www.paypal.me/LeonardoRignanese
  - https://www.buymeacoffee.com/rignaneseleo

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_jailbreak_detection:
    git:
      url: https://github.com/pdurasie-ecovery/flutter_jailbreak_detection.git
      ref: add-namespace
  webview_flutter: 4.10.0
  flutter_custom_tabs: 2.2.1
  url_launcher: 6.3.1
  permission_handler: 11.4.0
  shared_preferences: 2.5.3
  app_links: 6.4.0
  settings_ui: 2.0.2
  flutter_riverpod: 2.6.1
  in_app_purchase: ^3.3.0
  fluttertoast: 8.2.12
  easy_localization: ^3.0.8
  package_info_plus: 8.3.0
  restart_app: 1.3.2
  in_app_review: 2.0.10
  share_plus: 10.1.4
  file_picker: 10.0.0
  flutter_file_downloader: 2.1.0
  open_file_plus:
    git:
      url: https://github.com/postflow/open_file_plus.git
  native_flutter_proxy: 0.2.3

  sentry_flutter: ^9.28.0

  webview_flutter_android: any
dev_dependencies:
  fake_async: 1.3.3
  flutter_launcher_icons: 0.14.3
  custom_lint: 0.7.5
  very_good_analysis: 7.0.0

  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  #android: "launcher_icon"
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4762A2"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive_monochrome.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lang/
