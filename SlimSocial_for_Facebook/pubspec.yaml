name: slimsocial_for_facebook
description: Webview to securely navigate Facebook
publish_to: "none"
version: 26.01.23+200

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.13.1
  webview_flutter_android: any
  webview_flutter_wkwebview: any

  # URL handling
  flutter_custom_tabs: ^2.4.1
  url_launcher: ^6.3.2
  app_links: ^7.0.0

  # Permissions
  permission_handler: ^12.0.1

  # Storage
  shared_preferences: ^2.5.4

  # UI
  settings_ui: ^2.0.2
  google_fonts: ^7.1.0

  # State Management - Riverpod with annotations
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Payments
  in_app_purchase: ^3.2.3

  # Utilities
  fluttertoast: ^9.0.0
  package_info_plus: ^9.0.0
  restart_app: ^1.3.2
  in_app_review: ^2.0.11
  share_plus: ^12.0.1
  file_picker: ^10.3.8
  flutter_file_downloader: ^2.1.0
  native_flutter_proxy: ^0.2.3

  # Localization
  easy_localization: ^3.0.8

  # Security
  flutter_jailbreak_detection:
    git:
      url: https://github.com/pdurasie-ecovery/flutter_jailbreak_detection.git
      ref: add-namespace

  # File operations
  open_file_plus:
    git:
      url: https://github.com/postflow/open_file_plus.git

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

  # Code generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1

  # Icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/lang/
